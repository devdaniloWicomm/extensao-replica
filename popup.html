<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Ponte do Figma</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      p {
        margin: 0 0 8px;
      }
      ol {
        margin: 0;
        padding-left: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Ponte do Figma ativa</h1>
    <p>Traz as imagens quando você cola frames do Figma no gerador. Não precisa configurar nada.</p>
    <ol>
      <li>No Figma, selecione os frames e dê Ctrl+C.</li>
      <li>Na mesa do gerador, dê Ctrl+V.</li>
    </ol>
  </body>
</html>
